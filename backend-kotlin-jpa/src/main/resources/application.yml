spring:
  application:
    name: backend-microservice
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/xpenses}
    username: ${SPRING_DATASOURCE_USERNAME:xpenses}
    password: ${SPRING_DATASOURCE_PASSWORD:xpenses}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 16
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cache:
    type: jcache
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

jwt:
  secret: ${JWT_SECRET:}
  access-expires-minutes: 60
  refresh-expires-days: 30
  cookie:
    access-max-age-seconds: 2592000  # 30 days, matches refresh TTL by default

encryption:
  secret: ${ENCRYPTION_SECRET:}

seed:
  demo:
    users: ${SEED_DEMO_USERS:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://127.0.0.1:3001}

company:
  name: ${COMPANY_NAME:Newtech Automation}

rate-limiting:
  enabled: ${RATE_LIMITING_ENABLED:true}
  # Only these immediate proxy addresses may provide X-Forwarded-For/X-Real-IP.
  trusted-proxies: ${TRUSTED_PROXY_ADDRESSES:}
  max-tracked-keys: ${RATE_LIMITING_MAX_TRACKED_KEYS:10000}
  store: ${RATE_LIMITING_STORE:memory}
  fail-closed: ${RATE_LIMITING_FAIL_CLOSED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

bucket4j:
  enabled: true
  cache-to-use: jcache
  filters:
    - cache-name: rate-limit-cache
      filter-method: servlet
      filter-order: -100
      url: /api/auth/login
      http-response-body: '{"detail": "Too many login requests. Please try again later."}'
      rate-limits:
        - cache-key: getRemoteAddr()
          bandwidths:
            - capacity: 10
              time: 1
              unit: minutes
    - cache-name: rate-limit-cache
      filter-method: servlet
      filter-order: -100
      url: /api/auth/refresh
      http-response-body: '{"detail": "Too many token refresh requests. Please try again later."}'
      rate-limits:
        - cache-key: getRemoteAddr()
          bandwidths:
            - capacity: 20
              time: 1
              unit: minutes

imap:
  poll-interval: ${IMAP_POLL_INTERVAL:300000}

ocr:
  cache:
    retention-days: ${OCR_CACHE_RETENTION_DAYS:90}
    cleanup-interval: ${OCR_CACHE_CLEANUP_INTERVAL:86400000}
    cleanup-batch-size: ${OCR_CACHE_CLEANUP_BATCH_SIZE:100}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

server:
  forward-headers-strategy: framework
