# Reasonix configuration.
# Resolution order: flag > ./reasonix.toml > ~/.config/reasonix/config.toml > built-in defaults.
# Secrets come from the environment via api_key_env; never put keys here.

config_version = 2   # schema marker for diagnostics; old versions may ignore it
default_model = "deepseek-flash"
language      = "en"   # ui/model language; empty = auto-detect from $LANG / $REASONIX_LANG

[ui]
theme = "auto"   # auto|dark|light; CLI colors only; REASONIX_THEME can override per run
# theme_style = "graphite"   # graphite|aurora|slate|carbon|nocturne|amber and legacy aliases
# shortcut_layout = "desktop"   # classic|desktop; compatibility setting; Shift+Tab toggles Plan, Ctrl+Y toggles YOLO
show_reasoning = true   # CLI: show thinking text by default; false = collapsed (toggle with Ctrl+O)

[network]
proxy_mode = "auto"   # auto|env|custom|off; auto currently uses env proxy
# proxy_url  = "socks5://127.0.0.1:7890"   # optional custom override
# no_proxy   = "localhost,127.0.0.1,.local"   # honored for proxy_mode = "custom"

[network.proxy]
type = "socks5"   # http|https|socks5|socks5h
# server = "127.0.0.1"
# port = 7890
# username = ""
# password = "${REASONIX_PROXY_PASSWORD}"   # optional; supports ${VAR} expansion

[agent]
# system_prompt = """..."""   # omit to use the built-in prompt for this version
# system_prompt_file = "prompts/system.md"   # overrides system_prompt when set
# max_steps         = 0   # executor tool-call rounds; 0 = no limit
# planner_max_steps = 12   # planner read-only tool-call rounds; 0 = no limit
temperature       = 0.0
auto_plan   = "off"   # off|on; off keeps plan mode manual
# reasoning_language = "zh"   # visible reasoning language: auto|zh|en
# auto_plan_classifier = "deepseek-flash"   # optional; only used for borderline tasks
soft_compact_ratio  = 0.5   # notice only; keeps cache-first prefix intact
compact_ratio       = 0.8   # try compacting when prompt reaches this fraction
compact_force_ratio = 0.9   # force compacting at this high-water mark
cold_resume_prune   = true   # elide stale tool results when reopening a session past the provider cache window
# planner_model = "mimo"   # optional: enable two-model collaboration
# subagent_model = "deepseek-pro"   # optional default for runAs=subagent skills
# subagent_models = { review = "deepseek-pro", security_review = "deepseek-pro" }   # per-skill overrides
# subagent_effort = "high"   # optional default effort for subagents
# subagent_efforts = { review = "max", task = "high" }   # per-tool/skill effort overrides
# output_style = "explanatory"   # explanatory | learning | concise | custom; empty = default

[[providers]]
name        = "deepseek-flash"
kind        = "openai"
base_url    = "https://api.deepseek.com"
model       = "deepseek-v4-flash"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"   # optional; wallet-balance endpoint shown in the status bar
context_window = 1000000   # tokens; compaction triggers near this limit
price       = { cache_hit = 0.02, input = 1, output = 2, currency = "¥" }   # per 1M tokens

[[providers]]
name        = "deepseek-pro"
kind        = "openai"
base_url    = "https://api.deepseek.com"
model       = "deepseek-v4-pro"
api_key_env = "DEEPSEEK_API_KEY"
balance_url = "https://api.deepseek.com/user/balance"   # optional; wallet-balance endpoint shown in the status bar
context_window = 1000000   # tokens; compaction triggers near this limit
price       = { cache_hit = 0.025, input = 3, output = 6, currency = "¥" }   # per 1M tokens

[tools]
enabled = []   # empty = all built-in tools
bash_timeout_seconds = 120   # foreground safety cap; set 0 for no tool-local cap

[codegraph]
enabled      = true   # built-in MCP server; off by default for first-run sessions
auto_install = true   # fetch the runtime when CodeGraph is enabled but missing
# path       = ""   # empty = cache, then PATH, then a bundle beside reasonix

[builtin_mcp]
time_enabled = true   # built-in Time MCP; off until manually enabled
context7_enabled = false   # built-in Context7 MCP; off until manually enabled

[lsp]
enabled = true   # language server tools; servers launch lazily when used
# [lsp.servers.go]
# command = "gopls"
# args = []
# extensions = [".go"]

[skills]
# paths = ["~/my-skills", "../shared/skills"]   # extra custom skill roots
# excluded_paths = ["~/.agents/skills"]   # hide convention roots without deleting folders
# max_depth = 3   # nested scan depth; set 1 for legacy root-only discovery
# disabled_skills = ["review"]   # hide noisy or unwanted skills

[permissions]
# Per-call gating. mode = writer fallback when no rule matches: ask|allow|deny.
# Readers always default to allow. Precedence: deny > ask > allow > fallback.
# Rules are "Tool" or "Tool(specifier)"; e.g. Bash(go test:*), Edit(src/**).
mode  = "ask"
# deny = ["Bash(rm -rf*)", "Bash(git push*)"]   # hard-blocked in every mode
allow = ["install_source", "Bash(ls -la ~/.config/reasonix/ 2>&1; echo \"---\"; ls -la ~/.reasonix/ 2>&1; echo \"---\"; ls -la ~/.agents/ 2>&1)", "Bash(which reasonix 2>&1; reasonix --version 2>&1)", "Bash(find ~/.agents/ -type f 2>/dev/null)", "Bash(ls -la ~/.config/reasonix/projects/ 2>&1; echo \"===\"; ls -la ~/.config/reasonix/sessions/ 2>&1)", "Bash(find ~/.config -maxdepth 2 -name \"*hermes*\" 2>/dev/null; find ~/.config -maxdepth 2 -name \"*reasonix*\" -o -name \"*agent*\" 2>/dev/null | head -20)", "Bash(npm search @modelcontextprotocol/server-fetch 2>&1 | head -20)", "Bash(ls -la ~/.hermes/ 2>&1; echo \"===\"; which hermes 2>&1; hermes --version 2>&1)", "Bash(hermes config --help 2>&1 | head -50)", "Bash(npm search mcp-server-fetch 2>&1 | head -20)", "Bash(npm search @anthropic/mcp-server 2>&1 | head -20)", "Bash(npm search @anthropic/mcp-server-postgres 2>&1 | head -10; echo \"---\"; npm search mcp-server-postgres 2>&1 | head -10)", "Bash(npx skills add mattpocock/skills@improve-codebase-architecture -g -y 2>&1)", "Bash(npx skills add mattpocock/skills@tdd -g -y 2>&1)", "Bash(npx skills add anthropics/skills@webapp-testing -g -y 2>&1)", "Bash(curl -s https://api.github.com/repos/mattpocock/skills/contents/skills 2>&1 | head -40)", "Bash(curl -s https://api.github.com/repos/mattpocock/skills/git/trees/main?recursive=1 2>&1 | python3 -c \"import json,sys; data=json.load(sys.stdin); [print(t['path']) for t in data.get('tree',[]) if 'skills/' in t['path']]\" 2>&1 | head -40)", "Bash(grep -c '\\[mcp_servers\\.' /home/poa/xpenses-kotlin/reasonix.toml 2>/dev/null; grep 'name =' /home/poa/xpenses-kotlin/reasonix.toml 2>/dev/null)", "Bash(wc -l backend-kotlin-jpa/src/main/kotlin/eu/nt/xpenses/controllers/*.kt backend-kotlin-jpa/src/main/kotlin/eu/nt/xpenses/services/*.kt backend-kotlin-jpa/src/main/kotlin/eu/nt/xpenses/models/Models.kt 2>/dev/null | sort -rn | head -30)", "Bash(wc -l frontend/app/**/*.tsx frontend/app/**/**/*.tsx frontend/app/**/**/**/*.tsx 2>/dev/null | sort -rn | head -20)", "Bash(cd /home/poa/xpenses-kotlin && git log --oneline -5)", "Bash(cd /home/poa/xpenses-kotlin && git status --short)", "Bash(cd /home/poa/xpenses-kotlin && git log --oneline -10 --format=\"%h %s (%ai)\")", "Bash(cd /home/poa/xpenses-kotlin && git log --oneline --format=\"%h %s (%ai)\" 6fb8866..HEAD)"]
# ask = ["Edit(src/**)"]   # force a prompt even if otherwise allowed

[sandbox]
# Confine tool blast radius. File-writers (write_file/edit_file/multi_edit/move_file)
# may only write under workspace_root (empty = current dir) + allow_write.
# bash = "enforce" (default) jails each command in an OS sandbox (macOS now;
# graceful fallback elsewhere); "off" disables it. network allows egress.
# workspace_root = ""            # default: current working directory
# allow_write = ["/tmp"]          # extra dirs writers may also modify
bash    = "enforce"
network = true

[statusline]
# A custom status line: a command whose first stdout line replaces the built-in
# data row. It receives {"model","contextUsed","contextWindow","cwd"} as JSON on stdin.
# command = "my-statusline.sh"

# Bot gateway: multi-channel IM bot for QQ, Feishu/Lark, and WeChat.
[bot]
enabled = false
# model = ""   # empty = default_model
tool_approval_mode = "ask"   # ask|auto|yolo; yolo skips tool approvals only
max_steps = 25
debounce_ms = 1500

[bot.allowlist]
enabled = true
allow_all = false
qq_users = []
feishu_users = []
weixin_users = []
qq_groups = []
feishu_groups = []
weixin_groups = []

[bot.qq]
enabled = false
app_id = ""
app_secret_env = "QQ_BOT_APP_SECRET"
sandbox = false

[bot.feishu]
enabled = false
app_id = ""
domain = "feishu"
app_secret_env = "FEISHU_BOT_APP_SECRET"
verification_token = ""
mode = "webhook"
webhook_port = 8080
require_mention = true

[bot.weixin]
enabled = false
account_id = "default"
token_env = "WEIXIN_BOT_TOKEN"
api_base = "https://ilinkai.weixin.qq.com"

# External MCP servers. type: "stdio" (default, a subprocess) | "http" | "sse".
# ${VAR} / ${VAR:-default} are expanded from the environment in command/args/env/url/headers.

[[plugins]]
name    = "modelcontextprotocol-server-filesystem"
command = "npx"
args    = ["-y", "@modelcontextprotocol/server-filesystem"]

[[plugins]]
name    = "modelcontextprotocol-server-memory"
command = "npx"
args    = ["-y", "@modelcontextprotocol/server-memory"]

[[plugins]]
name    = "modelcontextprotocol-server-sequential-thinking"
command = "npx"
args    = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[[plugins]]
name    = "mcp-server-git"
command = "uvx"
args    = ["mcp-server-git", "--repository", "/home/poa/xpenses-kotlin"]

[[plugins]]
name    = "mcp-server-fetch-typescript"
command = "npx"
args    = ["-y", "mcp-server-fetch-typescript"]
