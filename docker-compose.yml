services:
  db:
    image: postgres:16-alpine
    container_name: xpenses-db
    environment:
      POSTGRES_USER: xpenses
      POSTGRES_PASSWORD: xpenses
      POSTGRES_DB: xpenses
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - xpenses-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xpenses"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xpenses-backend
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://xpenses:xpenses@db:5432/xpenses
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/xpenses:/app/xpenses
      - ./backend/tests:/app/tests
      - ./backend/pyproject.toml:/app/pyproject.toml
      - xpenses-data:/app/data
      - ocr-models:/root/.EasyOCR
    command: uvicorn xpenses.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - xpenses-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xpenses-frontend
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8001/api
      - INTERNAL_API_URL=http://backend:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - xpenses-net

  # ── MinerU 2.5 local OCR API (opt-in) ────────────────────────────────────
  # Start with: docker compose --profile mineru up -d mineru
  # Or rebuild:  docker compose --profile mineru build mineru
  # Accessible from backend container at: http://mineru:8000
  mineru:
    build:
      context: ./mineru
      dockerfile: Dockerfile
    container_name: xpenses-mineru
    profiles:
      - mineru
    ports:
      - "8002:8000"   # optional: reach from host at http://localhost:8002
    volumes:
      - mineru-models:/root/.cache   # cache downloaded models between restarts
    networks:
      - xpenses-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # give time for models to load on first start

networks:
  xpenses-net:
    driver: bridge

volumes:
  xpenses-data:
    driver: local
  pgdata:
    driver: local
  ocr-models:
    driver: local
  mineru-models:
    driver: local
