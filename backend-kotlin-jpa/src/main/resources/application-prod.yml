# Production overrides: fail fast on missing secrets and validate schema history.
spring:
  flyway:
    baseline-on-migrate: false
    validate-on-migrate: true
  data:
    redis:
      url: ${REDIS_URL}

jwt:
  # Production must provide both values; there are no safe defaults.
  secret: ${JWT_SECRET}
  salt: ${JWT_SALT}

encryption:
  secret: ${ENCRYPTION_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

cookie:
  secure: true

rate-limiting:
  # CIDR ranges or IPs of trusted reverse proxies/load balancers allowed to supply forwarded client IP headers.
  trusted-proxies: ${TRUSTED_PROXY_ADDRESSES:127.0.0.1,172.16.0.0/12,10.0.0.0/8}
  max-tracked-keys: ${RATE_LIMITING_MAX_TRACKED_KEYS:10000}
  store: ${RATE_LIMITING_STORE:redis}
  fail-closed: ${RATE_LIMITING_FAIL_CLOSED:true}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false