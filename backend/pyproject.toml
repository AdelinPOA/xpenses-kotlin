[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xpenses"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.2",
    "uvicorn[standard]==0.30.1",
    "asyncpg==0.30.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.4.0",
    "python-multipart==0.0.9",
    "httpx==0.27.0",
    "aiofiles==24.1.0",
    "reportlab==4.2.5",
    "pypdf==4.3.1",
    "Pillow==10.4.0",
    "PyJWT==2.9.0",
    "bcrypt==4.2.1",
    "easyocr>=1.7",
    "pdf2image>=1.17",
    "ldap3>=2.9",
    "cryptography>=42",
    "aiosmtplib==3.0.1",
    "email-validator==2.2.0",
    "smbprotocol>=1.12.0",
    "paramiko>=3.4.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.8.0",
    "pytest-cov",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["xpenses*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E701"]
