# Kotlin 2.1.0 does not support JDK 25+. If the system JDK is 25, set JAVA_HOME to JDK 21
# before running Gradle locally (e.g. export JAVA_HOME=~/.gradle/jdks/eclipse_adoptium-21-amd64-linux.2).
# CI uses actions/setup-java@v4 with java-version: '21', so no override is needed there.
# Do NOT hardcode org.gradle.java.home here — paths are machine-specific and will break CI.

# Enable Gradle Build Cache
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs=-Xmx2g

# Security patch overrides
# Tomcat: CVE-2026-41293, CVE-2026-43512, CVE-2026-43515
tomcat.version=10.1.55
# Spring Security: CVE-2025-41232, CVE-2025-41248, CVE-2026-22732
spring-security.version=6.4.10
# Spring Framework: CVE-2025-41249
spring-framework.version=6.2.11
# Netty: CVE-2026-42583, CVE-2026-33870, CVE-2026-42584, CVE-2026-42587
netty.version=4.1.133.Final
