services:
  db:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    container_name: xpenses-db
    environment:
      POSTGRES_USER: xpenses
      POSTGRES_PASSWORD: xpenses
      POSTGRES_DB: xpenses
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - xpenses-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xpenses"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    image: xpenses-backend:latest
    build:
      context: ./backend-kotlin-jpa
      dockerfile: Dockerfile
    container_name: xpenses-backend
    ports:
      - "8001:8080"
    env_file: .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/xpenses
      - SPRING_DATASOURCE_USERNAME=xpenses
      - SPRING_DATASOURCE_PASSWORD=xpenses
      - SEED_DEMO_USERS=${SEED_DEMO_USERS:-true}
    depends_on:
      db:
        condition: service_healthy
      ocr-sidecar:
        condition: service_healthy
    volumes:
      - xpenses-data:/app/data
    networks:
      - xpenses-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    image: xpenses-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xpenses-frontend
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8001/api
      - INTERNAL_API_URL=http://backend:8080/api
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - xpenses-net

  # ── MinerU 2.5 local OCR API (opt-in) ────────────────────────────────────
  # Start with: docker compose --profile mineru up -d mineru
  # Or rebuild:  docker compose --profile mineru build mineru
  # Accessible from backend container at: http://mineru:8000
  # GPU: uses Intel Arc / integrated GPU via /dev/dri + Level Zero compute runtime
  mineru:
    image: xpenses-mineru:latest
    build:
      context: ./mineru
      dockerfile: Dockerfile
    container_name: xpenses-mineru
    profiles:
      - mineru
    ports:
      - "8002:8000"   # optional: reach from host at http://localhost:8002
    volumes:
      - mineru-models:/home/mineru/.cache   # cache downloaded models between restarts
      - ./mineru/gpu-libs:/opt/intel/gpu-libs:ro   # host Intel GPU compute libs (Level Zero driver)
    networks:
      - xpenses-net
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri        # Intel GPU (Arc / integrated)
    group_add:
      - "44"                     # video group (access /dev/dri/card*)
      - "107"                    # render group (access /dev/dri/renderD*)
    environment:
      - MINERU_DEVICE_MODE=xpu   # use Intel XPU (via IPEX)
      - LD_LIBRARY_PATH=/opt/intel/gpu-libs  # find host's GPU libs
      - SYCL_CACHE_PERSISTENT=1  # keep compiled SYCL kernels between runs
      - NEO_CACHE_DIR=/tmp/neo-cache  # cache GPU binary kernels
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # give time for models to load on first start

  ocr-sidecar:
    image: xpenses-ocr-sidecar:latest
    build:
      context: ./ocr-sidecar
      dockerfile: Dockerfile
    container_name: xpenses-ocr-sidecar
    volumes:
      - ocr-models:/home/ocr/.EasyOCR
    networks:
      - xpenses-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  xpenses-net:
    driver: bridge

volumes:
  xpenses-data:
    driver: local
  pgdata:
    driver: local
  ocr-models:
    driver: local
  mineru-models:
    driver: local
