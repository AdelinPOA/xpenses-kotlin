# Kotlin 2.1.0 does not support JDK 25+. If the system JDK is 25, set JAVA_HOME to JDK 21
# before running Gradle locally (e.g. export JAVA_HOME=~/.gradle/jdks/eclipse_adoptium-21-amd64-linux.2).
# CI uses actions/setup-java@v4 with java-version: '21', so no override is needed there.
# Do NOT hardcode org.gradle.java.home here — paths are machine-specific and will break CI.

# Enable Gradle Build Cache — task outputs are stored in ~/.gradle/caches/build-cache-1
# and reused across builds. Combined with Docker BuildKit cache mounts on ~/.gradle,
# this gives near-instant rebuilds when source files haven't changed.
org.gradle.caching=true

# Security patch overrides — bump tomcat and spring-security to fix CVEs
# CVE-2026-41293, CVE-2026-43512, CVE-2026-43515 → tomcat 10.1.55+
# CVE-2025-41232 → spring-security 6.4.6+, CVE-2026-22732 → 6.5.9+
tomcat.version=10.1.55
spring-security.version=6.4.6
