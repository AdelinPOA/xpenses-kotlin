name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  gitleaks:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks
        # gitleaks-action v2
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-kotlin:
    name: Build & Test Kotlin Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and Test Kotlin Backend
        run: |
          cd backend-kotlin-jpa
          ./gradlew test bootJar --no-daemon

  build-frontend:
    name: Build & Lint Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Chromium for frontend browser regressions
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run auth unit and session refresh regressions
        run: npm run test:auth-regressions --prefix frontend

      - name: Run capture review and release-gate regressions
        run: |
          cd frontend
          node --test tests/expenses/ocr-source-queue.test.cjs \
            tests/expenses/capture-resume-state.test.cjs \
            tests/expenses/receipt-capture.test.cjs \
            tests/expenses/ocr-recovery-client.test.cjs
          INTERNAL_API_URL=http://127.0.0.1:18089/api PLAYWRIGHT_PORT=3120 \
            npx playwright test tests/expenses/capture-review.spec.ts \
            tests/auth/login-hydration.spec.ts \
            --project=mobile-chromium --workers=1
          NEXT_PUBLIC_OCR_IMMEDIATE_REVIEW_ENABLED=false \
            INTERNAL_API_URL=http://127.0.0.1:18089/api PLAYWRIGHT_PORT=3121 \
            npx playwright test tests/expenses/capture-feature-gate.spec.ts \
            --project=mobile-chromium --workers=1

      - name: Check types
        run: |
          cd frontend
          npx tsc --noEmit
      - name: Check translation parity
        run: |
          cd frontend
          npm run i18n:check

      - name: Lint
        run: |
          cd frontend
          npm run test:lint-config
          npm run lint

      - name: Verify rehearsal isolation guards
        run: |
          python3 -m unittest discover -s scripts \
            -p 'test_verify_ocr_restart.py'
          python3 -O -m unittest discover -s scripts \
            -p 'test_verify_ocr_restart.py'

      - name: Build
        run: |
          cd frontend
          npm run build

  compose-integration:
    name: Compose Integration & Security Gates
    runs-on: ubuntu-latest
    needs: [build-kotlin, build-frontend]
    permissions:
      contents: read
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: xpenses-ci
      COMPOSE_FILE: docker-compose.yml:.github/docker-compose.ci.yml
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend test dependencies
        run: npm ci --prefix frontend

      - name: Create disposable CI environment
        shell: bash
        run: |
          set -euo pipefail
          ci_user="ci-tech-$(openssl rand -hex 6)"
          ci_password="$(openssl rand -hex 24)"
          db_password="$(openssl rand -hex 24)"
          jwt_secret="$(openssl rand -hex 32)"
          jwt_salt="$(openssl rand -hex 32)"
          encryption_secret="$(openssl rand -hex 32)"

          for secret in "$ci_user" "$ci_password" "$db_password" \
            "$jwt_secret" "$jwt_salt" "$encryption_secret"; do
            echo "::add-mask::$secret"
          done

          cat > .env <<EOF
          COMPOSE_CONTAINER_PREFIX=xpenses-ci
          DB_USER=xpenses
          DB_PASSWORD=$db_password
          DB_NAME=xpenses
          JWT_SECRET=$jwt_secret
          JWT_SALT=$jwt_salt
          ENCRYPTION_SECRET=$encryption_secret
          SPRING_PROFILES_ACTIVE=ci
          SEED_DEMO_USERS=false
          COOKIE_SECURE=false
          CI_TEST_TECHNICIAN_USERNAME=$ci_user
          CI_TEST_TECHNICIAN_PASSWORD=$ci_password
          CORS_ALLOWED_ORIGINS=http://localhost:3001,http://127.0.0.1:3001
          REDIS_URL=redis://redis:6379
          RATE_LIMITING_ENABLED=false
          NEXT_PUBLIC_OCR_IMMEDIATE_REVIEW_ENABLED=true
          FRONTEND_BIND_IP=127.0.0.1
          BACKEND_BIND_IP=127.0.0.1
          EOF

          {
            echo "PLAYWRIGHT_USER=$ci_user"
            echo "PLAYWRIGHT_PASSWORD=$ci_password"
            echo "PLAYWRIGHT_AUTHENTICATED_UI=true"
            echo "PLAYWRIGHT_PORT=3001"
          } >> "$GITHUB_ENV"

      - name: Test npm audit policy
        run: node scripts/check-npm-audit.test.mjs

      - name: Audit frontend dependencies
        shell: bash
        run: |
          set +e
          npm audit --prefix frontend --json > frontend/npm-audit.json
          audit_exit=$?
          set -e
          node scripts/check-npm-audit.mjs frontend/npm-audit.json
          echo "npm audit command exit status: $audit_exit"

      - name: Build Docker images
        run: docker compose build backend frontend

      - name: Scan backend image
        # trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: xpenses-backend:latest
          format: json
          output: trivy-backend.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image
        # trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: xpenses-frontend:latest
          format: json
          output: trivy-frontend.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Start disposable Compose stack
        run: docker compose up --wait --wait-timeout 300

      - name: Verify service health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 2 \
            http://127.0.0.1:8001/api/health
          curl --fail --silent --show-error --retry 10 --retry-delay 2 \
            http://127.0.0.1:3001/login > /dev/null
          docker compose ps

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium webkit

      - name: Run authenticated mobile UI smoke tests
        run: npm run test:e2e:mobile --prefix frontend

      - name: Run authenticated capture integration
        env:
          PLAYWRIGHT_CAPTURE_INTEGRATION: "true"
        run: |
          cd frontend
          npx playwright test tests/expenses/capture-integration.spec.ts \
            --project=mobile-chromium --workers=1

      - name: Rehearse OCR recovery after backend restart
        run: >-
          python3 scripts/verify-ocr-restart.py --env-file .env
          --container-prefix xpenses-ci --backend-url http://127.0.0.1:8001
          --origin http://localhost:3001 --evidence-file restart-rehearsal.json

      - name: Collect Compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose.log || true

      - name: Upload CI evidence on failure
        if: failure()
        # upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compose-integration-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/npm-audit.json
            trivy-backend.json
            trivy-frontend.json
            compose.log
            restart-rehearsal.json
          if-no-files-found: ignore

      - name: Tear down disposable Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
