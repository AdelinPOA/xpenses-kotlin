services:
  db:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    container_name: ${COMPOSE_CONTAINER_PREFIX:-xpenses}-db
    environment:
      POSTGRES_USER: ${DB_USER:-xpenses}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-xpenses}
      POSTGRES_DB: ${DB_NAME:-xpenses}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - xpenses-net
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-xpenses}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: ${COMPOSE_CONTAINER_PREFIX:-xpenses}-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - xpenses-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    image: xpenses-backend:latest
    build:
      context: ./backend-kotlin-jpa
      dockerfile: Dockerfile
    container_name: ${COMPOSE_CONTAINER_PREFIX:-xpenses}-backend
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:8001:8080"
    env_file: .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME:-xpenses}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-xpenses}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-xpenses}
      - SEED_DEMO_USERS=${SEED_DEMO_USERS:-false}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - xpenses-data:/app/data
    networks:
      - xpenses-net
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    restart: unless-stopped

  frontend:
    image: xpenses-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_CONTAINER_PREFIX:-xpenses}-frontend
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://xpenses.nt-automation.cc/api
      - INTERNAL_API_URL=http://backend:8080/api
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - xpenses-net

networks:
  xpenses-net:
    driver: bridge

volumes:
  xpenses-data:
    driver: local
  pgdata:
    driver: local
  redisdata:
    driver: local
