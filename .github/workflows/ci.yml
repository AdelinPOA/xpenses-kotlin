name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xpenses
          POSTGRES_PASSWORD: xpenses
          POSTGRES_DB: xpenses
        ports: [5432:5432]
        # Give the database some time to start
        options: >-
          --health-cmd="pg_isready -U xpenses"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -U xpenses; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run lint
        run: |
          ruff check xpenses/ tests/

      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files

      - name: Run tests with coverage
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          POSTGRES_USER: xpenses
          POSTGRES_PASSWORD: xpenses
          POSTGRES_DB: xpenses
          SEED_DEMO_USERS: true
          COOKIE_SECURE: false
          CORS_ORIGINS: '["http://localhost:3001"]'
        run: |
          pytest tests/ --cov=xpenses --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Build Docker images
        run: |
          docker compose build
          docker compose ps
