# Build and runtime use the Java 21 toolchain.
# CI uses actions/setup-java with java-version: '21'.
# Do NOT hardcode org.gradle.java.home here — paths are machine-specific and will break CI.

# Enable Gradle Build & Configuration Cache
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=false
org.gradle.workers.max=2
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
# A second resident compiler JVM is undesirable on the production host.
kotlin.compiler.execution.strategy=in-process

# Boot 4 manages coherent Tomcat 11 / Spring 7 / Security 7 / Netty versions.
# Do not retain the previous Boot 3 generation pins here.
