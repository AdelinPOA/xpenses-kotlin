spring:
  application:
    name: backend-microservice
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/xpenses}
    username: ${SPRING_DATASOURCE_USERNAME:xpenses}
    password: ${SPRING_DATASOURCE_PASSWORD:xpenses}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 16
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cache:
    type: jcache

jwt:
  secret: ${JWT_SECRET:}
  access-expires-minutes: 15

seed:
  demo:
    users: ${SEED_DEMO_USERS:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://127.0.0.1:3001}

company:
  name: ${COMPANY_NAME:Newtech Automation}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

bucket4j:
  enabled: true
  cache-to-use: jcache
  filters:
    - cache-name: rate-limit-cache
      filter-method: servlet
      filter-order: -100
      url: /api/auth/login
      http-response-body: '{"detail": "Too many login requests. Please try again later."}'
      rate-limits:
        - cache-key: getRemoteAddr()
          bandwidths:
            - capacity: 10
              time: 1
              unit: minutes
    - cache-name: rate-limit-cache
      filter-method: servlet
      filter-order: -100
      url: /api/auth/refresh
      http-response-body: '{"detail": "Too many token refresh requests. Please try again later."}'
      rate-limits:
        - cache-key: getRemoteAddr()
          bandwidths:
            - capacity: 5
              time: 1
              unit: minutes

imap:
  poll-interval: ${IMAP_POLL_INTERVAL:300000}
