services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xpenses-backend
    ports:
      - "8001:8000"
    env_file: .env
    volumes:
      - ./backend/xpenses:/app/xpenses
      - xpenses-data:/app/data
    command: uvicorn xpenses.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - xpenses-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xpenses-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8001/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - xpenses-net

networks:
  xpenses-net:
    driver: bridge

volumes:
  xpenses-data:
    driver: local
